    <style>
        :root {

            --bg-panel: #0b111e;

        * {

            margin: 0;
            padding: 0;

        body {

            padding-top: 170px;
        }

        /* --- NAVBAR & MATRIX CONTROLS --- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(2, 4, 10, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-muted);
            padding: 20px 50px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;

        .nav-top-row {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            align-items: center;
            width: 100%;
        }

        .logo-section {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(90deg, #ffffff, var(--accent-neon), var(--accent-glow), #ffffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            cursor: pointer;
            animation: textFlow 5s linear infinite;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            /* लोगो और नाम को ऊपर-नीचे से एक बराबर रखता है */
            gap: 12px;
            /* लोगो और नाम के बीच का गैप */
            cursor: pointer;
            justify-self: start;
        }

        .nav-logo {
            width: 38px;
            /* कंप्यूटर पर लोगो का साइज */
            height: 38px;
            object-fit: contain;
            border-radius: 8px;
        }

        @keyframes textFlow {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        .search-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .search-box-container {
            position: relative;
            width: 100%;
            max-width: 580px;
        }

        .search-bar {
            width: 100%;
            padding: 15px 24px;
            background: rgba(18, 27, 45, 0.6);
            border: 1px solid var(--border-muted);
            border-radius: var(--radius-premium);
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            /* Transition ko aur smooth banaya hai */
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);

        /* Hover effect: Jab mouse upar jaye */
        .search-bar:hover {
            transform: scale(1.01);
            /* Halki si expansion */
            border-color: var(--accent-neon);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
        }

        /* Focus effect: Jab click karke type kare */
        .search-bar:focus {
            transform: scale(1.02);
            /* Focus par thoda zyada expand */
            border-color: var(--accent-neon);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.3);
            background: #0f172a;
            /* Thoda darker aur focused background */
        }

        /* --- CONTROLLER CAPSULES --- */
        .filter-capsules-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
            flex-wrap: wrap;
            /* Allows wrap on small devices */

        .capsule-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-muted);
            padding: 8px 18px;
            border-radius: 30px;
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fluid);
            white-space: nowrap;
        }

        .capsule-btn:hover,
        .capsule-btn.active {
            background: var(--bg-surface);
            color: #ffffff;
            border-color: var(--accent-neon);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
        }

        .autocomplete-panel {
            position: absolute;
            top: calc(100% + 12px);
            left: 0;
            width: 100%;
            background: rgba(11, 17, 30, 0.98);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-premium);
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            display: none;
            z-index: 1100;

        .autocomplete-row {
            padding: 15px 24px;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.01);
            transition: var(--transition-fluid);
        }

        .autocomplete-row:hover {
            background: var(--gradient-master);
            color: #ffffff;
            padding-left: 32px;
        }

        /* --- CORE ARCHITECTURE LAYOUT --- */
        .app-workspace {

            background-color: var(--bg-panel);
            padding: 30px 22px;
            border-radius: var(--radius-premium);
            border: 1px solid var(--border-muted);
            position: sticky;

            max-height: calc(100vh - 240px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);

            padding-right: 4px;

            font-weight: 600;

        }

        .display-section {
            flex-grow: 1;
            min-width: 0;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 28px;
        }

        .grid-card {
            background: rgba(18, 27, 45, 0.4);
            /* Thoda transparent */
            backdrop-filter: blur(12px);
            /* Glass blur effect */
            padding: 35px;
            border-radius: var(--radius-premium);
            border: 1px solid rgba(255, 255, 255, 0.08);

            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .grid-card:hover {
            border-color: var(--accent-neon);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 10px rgba(6, 182, 212, 0.2);
            transform: translateY(-8px);

            align-items: center;
            justify-content: space-between;

            text-transform: uppercase;

            color: var(--badge-free-txt);
        }

        .status-badge.paid {
            background: var(--badge-paid-bg);
            color: var(--badge-paid-txt);

            color: var(--accent-neon);
            border: 1px solid rgba(6, 182, 212, 0.2);
        }

            border: none;

            font-size: 1.35rem;
            cursor: pointer;
            transition: var(--transition-fluid);
            outline: none;
        }

        .bookmark-star:hover {
            color: #facc15;
            transform: scale(1.1);

        .bookmark-star.starred {
            color: #facc15;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.4);

        .grid-card .hierarchy-tag {

            color: var(--accent-neon);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;

        .grid-card h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            color: #ffffff;
            margin-bottom: 14px;
        }

        .grid-card p {
            font-size: 0.92rem;
            color: var(--text-sub);
            margin-bottom: 20px;
            line-height: 1.6;
            flex-grow: 1;
        }

        .card-footer-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-link {
            flex-grow: 1;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: var(--radius-premium);
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid var(--border-muted);
            transition: var(--transition-fluid);
            white-space: nowrap;
        }

        .grid-card:hover .action-link {
            background: var(--gradient-master);
            border-color: transparent;
        }

        .report-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition-fluid);

           💻 EXTRA STABLE RESPONSIVE ENGINE (MEDIA QUERIES)

        /* 1. Large Screen Adjustments (Tablets up to Laptops) */
        @media (max-width: 1250px) {
            body {
                padding-top: 200px;

                grid-template-columns: 1fr 1fr;
                gap: 15px;

                grid-column: 1 / -1;
                order: 3;

            .app-workspace {
                gap: 30px;
                padding: 0 30px;
                margin-top: 20px;
            }

            .control-panel {
                width: 300px;
                min-width: 300px;
                top: 220px;
                max-height: calc(100vh - 260px);
            }

        @media (max-width: 992px) {
            body {
                padding-top: 250px;

            .navbar {
                padding: 15px;
            }

            .nav-top-row {
                display: flex;
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .app-workspace {
                flex-direction: column;
                padding: 0 24px;
                gap: 20px;
            }

            /* Sidebar turns into a sleek web horizontal swipe panel */
            .control-panel {
                width: 100%;
                min-width: 100%;
                height: auto;
                position: sticky;
                top: 210px;
                z-index: 900;
                padding: 15px;
                max-height: none;
            }

            .panel-scroller {
                display: flex;
                overflow-x: auto;
                gap: 12px;
                padding-bottom: 5px;
                scrollbar-width: none;
                /* Hidden scroll bar Firefox */
            }

            .panel-scroller::-webkit-scrollbar {
                display: none;
            }

            /* Hidden scroll bar Chrome/Safari */
            .group-header {
                display: none;
            }

            .category-trigger {
                white-space: nowrap;
                width: auto;
                margin-bottom: 0;
                padding: 10px 16px;
            }
        }

        /* 3. Pure Smartphone Mobile Devices */
        @media (max-width: 576px) {
            body {
                padding-top: 230px;
            }

            .navbar {
                padding: 12px 15px;
                gap: 10px;
            }

            .logo-section {
                font-size: 1.5rem;
            }

            .search-bar {
                padding: 12px 18px;
                font-size: 0.88rem;
            }

            .filter-capsules-row {
                gap: 6px;
                justify-content: flex-start;
                overflow-x: auto;
                scrollbar-width: none;
                width: 100%;
                padding-bottom: 2px;
            }

            .filter-capsules-row::-webkit-scrollbar {
                display: none;
            }

            .capsule-btn {
                padding: 6px 14px;
                font-size: 0.8rem;
            }

            .control-panel {
                top: 185px;
                padding: 10px;
            }

            .category-trigger {
                font-size: 0.85rem;
                padding: 8px 12px;
            }

            .app-workspace {
                padding: 0 15px;
            }

            .cards-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            /* Single column grids for mobile */
            .grid-card {
                padding: 22px;
            }

            .grid-card h3 {
                font-size: 1.25rem;
            }

            .grid-card p {
                font-size: 0.88rem;
                margin-bottom: 15px;
            }

            .action-link {
                padding: 10px;
                font-size: 0.85rem;
            }
        }

        .grid-card {
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 576px) {
            .grid-card {
                padding: 18px !important;
                /* Mobile pe thoda compact */
                gap: 10px;
            }

            .action-link {
                padding: 14px !important;
                /* Button ko bada karo taaki thumb se easily click ho */
            }
        }
    </style>
</head>

        const trendingTools = ["Canva", "Figma", "Notion", "ILovePDF", "Zomato", "Swiggy", "Trello", "Slack"];

        let masterToolsRegistry = [];
        let uniqueSubCategories = [];
        let bookmarkedRegistry = JSON.parse(localStorage.getItem('vortex_bookmarks')) || [];

        Object.keys(structuralData).forEach(fieldGroup => {
            structuralData[fieldGroup].forEach(subObj => {
                if (!uniqueSubCategories.includes(subObj.subCategory)) {
                    uniqueSubCategories.push(subObj.subCategory);
                }
                subObj.tools.forEach(t => {
                    masterToolsRegistry.push({
                        ...t,
                        category: subObj.subCategory,
                        parentField: fieldGroup
                    });
                });
            });
        });

        masterToolsRegistry.sort((a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }));

        function renderEcosystemControls() {
            const scroller = document.getElementById("panelScroller");

            Object.keys(structuralData).forEach(fieldGroup => {
                const headerDiv = document.createElement("div");
                headerDiv.classList.add("group-header");
                headerDiv.innerText = fieldGroup;
                scroller.appendChild(headerDiv);

                structuralData[fieldGroup].forEach(subObj => {
                    const btn = document.createElement("button");
                    btn.classList.add("category-trigger");
                    btn.id = `trigger-${subObj.subCategory.replace(/\s+/g, '-').toLowerCase()}`;
                    btn.setAttribute("onclick", `filterCategory('${subObj.subCategory}')`);
                    btn.innerHTML = `${subObj.subCategory} <span>➔</span>`;
                    scroller.appendChild(btn);
                });
            });
        }

        function presentSortedTools(tools) {
            const grid = document.getElementById("cardsGrid");
            grid.innerHTML = "";

            if (tools.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 40px; font-size: 1.1rem;">No digital applications found matching the active filters.</div>`;
                return;
            }

            tools.forEach((tool) => {
                const isStarred = bookmarkedRegistry.includes(tool.name);
                const isPopular = trendingTools.includes(tool.name);
                const isAi = aiDrivenTools.includes(tool.name);

                const card = document.createElement("div");
                card.classList.add("grid-card");

                card.innerHTML = `
                    <div>
                        <div class="meta-container">
                            <div class="badges-cluster">
                                <span class="status-badge ${tool.pricing}">${tool.pricing}</span>
                                ${isPopular ? '<span class="status-badge popular">POPULAR</span>' : ''}
                                ${isAi ? '<span class="status-badge ai-badge">AI</span>' : ''}
                            </div>
                            <button class="bookmark-star ${isStarred ? 'starred' : ''}" onclick="toggleBookmark('${tool.name}', event)">★</button>
                        </div>
                        <span class="hierarchy-tag">${tool.category}</span>
                        <h3>${tool.name}</h3>
                        <p>${tool.desc}</p>
                    </div>
                    <div class="card-footer-actions">
                        <a href="${tool.link}" target="_blank" class="action-link">Open Application ↗</a>
                        <button class="report-btn" onclick="reportBrokenLink('${tool.name}', event)">Report link</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        let currentActiveGroup = 'all';
        let currentPricingFilter = 'all';

        function filterCategory(categoryName) {
            // 💡 फिक्स: जब भी किसी कैटेगरी बटन पर क्लिक हो, सर्च बार को खाली कर दो
            document.getElementById("directorySearch").value = "";

            currentActiveGroup = categoryName;
            const buttons = document.querySelectorAll('.category-trigger');
            buttons.forEach(btn => btn.classList.remove('active'));

            if (categoryName === 'all') {
                document.getElementById('trigger-all').classList.add('active');
            } else if (categoryName === 'bookmarks_panel') {
                document.getElementById('trigger-bookmarks').classList.add('active');
            } else {
                const dynamicId = `trigger-${categoryName.replace(/\s+/g, '-').toLowerCase()}`;
                const targetBtn = document.getElementById(dynamicId);
                if (targetBtn) targetBtn.classList.add('active');
            }

            executeCombinedProcessing();
        }

        function setPricingFilter(filterType) {
            currentPricingFilter = filterType;
            const capsules = document.querySelectorAll('.capsule-btn');
            capsules.forEach(cap => cap.classList.remove('active'));
            document.getElementById(`filter-${filterType}`).classList.add('active');

            executeCombinedProcessing();
        }

        function toggleBookmark(toolName, event) {
            event.stopPropagation();
            if (bookmarkedRegistry.includes(toolName)) {
                bookmarkedRegistry = bookmarkedRegistry.filter(name => name !== toolName);
            } else {
                bookmarkedRegistry.push(toolName);
            }
            localStorage.setItem('vortex_bookmarks', JSON.stringify(bookmarkedRegistry));
            executeCombinedProcessing();
        }

        function reportBrokenLink(toolName, event) {
            event.stopPropagation();
            alert(`📝 Error report logged for "${toolName}". Our systems will evaluate this endpoint.`);
        }

        function triggerSearch() {
            const searchInput = document.getElementById("directorySearch");
            const dropPanel = document.getElementById("autoDrop");
            const query = searchInput.value.toLowerCase().trim();

            if (!query) {
                dropPanel.style.display = "none";
                executeCombinedProcessing();
                return;
            }

            const matchedCats = uniqueSubCategories.filter(cat => cat.toLowerCase().includes(query));

            if (matchedCats.length > 0) {
                dropPanel.innerHTML = "";
                matchedCats.forEach(cat => {
                    const row = document.createElement("div");
                    row.classList.add("autocomplete-row");
                    row.innerText = cat;
                    row.onclick = () => {
                        searchInput.value = cat;
                        dropPanel.style.display = "none";
                        filterCategory(cat);
                    };
                    dropPanel.appendChild(row);
                });
                dropPanel.style.display = "block";
            } else {
                dropPanel.style.display = "none";
            }
            executeCombinedProcessing();
        }

        function executeCombinedProcessing() {
            const queryStr = document.getElementById("directorySearch").value.toLowerCase().trim();

            const compilation = masterToolsRegistry.filter(tool => {
                let isolationMatch = false;
                if (currentActiveGroup === 'all') {
                    isolationMatch = true;
                } else if (currentActiveGroup === 'bookmarks_panel') {
                    isolationMatch = bookmarkedRegistry.includes(tool.name);
                } else {
                    isolationMatch = (tool.category === currentActiveGroup);
                }

                let pricingMatch = (currentPricingFilter === 'all' || tool.pricing === currentPricingFilter);
                let contextualMatch = tool.category.toLowerCase().includes(queryStr) || tool.name.toLowerCase().includes(queryStr) || tool.parentField.toLowerCase().includes(queryStr);

                return isolationMatch && pricingMatch && contextualMatch;
            });

            presentSortedTools(compilation);
        }

        document.addEventListener("click", function (e) {
            if (e.target.id !== "directorySearch") {
                document.getElementById("autoDrop").style.display = "none";
            }
        });

        window.onload = () => {
            renderEcosystemControls();
            presentSortedTools(masterToolsRegistry);
        };
    </script>
